"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Mike Skalnik"
email = "mike@skalnik.com"

[signing]
behavior = "own"
backend = "gpg"
key = "mike@skalnik.com"

[signing.backends.ssh]
program = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"

[ui]
default-command = "log"
diff-editor = ":builtin"

[colors]
"diff token" = { underline = false }
"diff removed token" = { fg = "ansi-color-16", bg = "ansi-color-214" }
"diff added token" = { fg = "ansi-color-16", bg = "ansi-color-189" }

# Stolen from https://zerowidth.com/2025/jj-tips-and-tricks/#bookmarks-and-branches
[aliases]
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
xl = ["log", "-r", "all()"]
ff = ["rebase", "-s", "roots(trunk()..@)", "-d", "trunk()"]
mm = ["rebase", "-s", "megamerge", "-A", "in_megamerge"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"in_merge(merge)" = "merge- ~ ::trunk()"
"megamerge" = "exactly((mine() & merges()) ~ ::trunk(), 1)"
"in_megamerge" = "in_merge(megamerge)"

[template-aliases]
"slugify(str)" = '''
  truncate_end(
    65,
    str.first_line()
      .replace(regex:'[^[[:alnum:]].]', '-')
      .replace(regex:'-{2,}', '-')
      .replace(regex:'\.{2,}', '.')
      .replace(regex:'(^-+|-+$)', '')
      .lower()
  )
'''

[templates]
git_push_bookmark = '"skalnik/" ++ slugify(description)'
# Stolen from @wfarr 🥰
# git commit --verbose, kinda:
draft_commit_description = '''
concat(
  description,
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.stat(72)),
  ),
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''

[fix.tools.ruff]
command = ["/opt/homebrew/bin/uv run ruff", "format", "$path"]
patterns = ["glob:**/*.py"]

[merge-tools.ksdiff]
program = "/usr/local/bin/ksdiff"
diff-invocation-mode = "file-by-file"
diff-args = [
  "--partial-changeset",
  "--relative-path",
  "$right",
  "--",
  "$left",
  "$right"
]
